<!DOCTYPE html>
<html lang="id">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2A32;
    --ink-soft:#4C6870;
    --primary:#0B5566;
    --primary-light:#1C8CA0;
    --primary-pale:#DCEEF1;
    --accent:#D98F3E;
    --accent-pale:#FBEBD8;
    --line:#C7DADD;
    --surface:#FFFFFF;
    --bg:#EFF5F6;
    --radius-lg:22px;
    --radius-md:14px;
    --purple:#7C6FC9;
    --purple-light:#A98FE0;
    --purple-pale:#E4DCF5;
    --paper:#F4F8FA;
    --card:#FFFFFF;
    --mist:#DCE9EF;
    --teal:#0E8E96;
    --teal-deep:#0A6A72;
    --amber:#B97709;
    --radius:14px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 500px at 15% -10%, #FFFFFF 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, var(--primary-pale) 0%, transparent 55%),
      linear-gradient(180deg, #F4F9FA 0%, var(--bg) 40%, #E7F1F2 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  a{ text-decoration:none; color:inherit; }
  ul{ list-style:none; }
  button{ font:inherit; }

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(244,248,250,.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--mist);
  }
  .nav{
    max-width:1280px;margin:0 auto;padding:14px 20px;
    display:flex;align-items:center;gap:20px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:linear-gradient(160deg,var(--teal) 0%,var(--ink) 100%);
    display:grid;place-items:center;color:#fff;
    font-size:13px;font-weight:700;
  }
  .brand small{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);line-height:1.2}
  .nav-links{display:flex;gap:4px;margin-left:auto}
  .nav-links button,.nav-links a{
    padding:7px 12px;border-radius:8px;font-size:14px;color:var(--ink-soft);
    transition:background .15s,color .15s;
  }
  .nav-links button:hover,.nav-links button.active,.nav-links a:hover,.nav-links a.active{background:#E7F1F4;color:var(--ink)}
  .btn-login{
    padding:8px 18px;border-radius:9px;font-size:14px;font-weight:600;
    background:var(--ink);color:#fff;transition:background .15s;
  }
  .btn-login:hover{background:var(--teal-deep)}
  .nav-toggle{display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:none;cursor:pointer;padding:8px;position:relative}
  .nav-toggle span{width:22px;height:2px;background:var(--ink);border-radius:2px;transition:transform .2s ease,opacity .2s ease}
  .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
  .nav-toggle.open span:nth-child(2){opacity:0}
  .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
  .nav-ic{display:none;flex-shrink:0}
  .nav-backdrop{display:none;position:fixed;inset:0;background:rgba(10,37,55,.35);z-index:40}
  @media(max-width:720px){
    .nav-toggle{display:flex;margin-left:auto}
    .nav-backdrop.open{display:block}
    .nav-links{
      display:flex;flex-direction:column;gap:2px;
      position:absolute;top:100%;left:0;right:0;
      background:var(--card);border-bottom:1px solid var(--mist);
      padding:10px 20px 14px;box-shadow:0 12px 24px -12px rgba(14,42,50,.15);
      opacity:0;visibility:hidden;transform:translateY(-6px);
      transition:opacity .18s ease,transform .18s ease,visibility .18s;
    }
    .nav-links.open{opacity:1;visibility:visible;transform:translateY(0)}
    .nav-links button,.nav-links a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px}
    .nav-ic{display:inline-flex}
  }

  /* ---------- admin chip ---------- */
  .nav-right{display:flex;align-items:center;gap:10px}
  .admin-wrap{position:relative}
  .admin-chip{
    display:flex;align-items:center;gap:8px;
    padding:6px 12px 6px 6px;border-radius:99px;
    border:1px solid var(--mist);background:var(--card);
    font-size:13px;font-weight:600;color:var(--ink);
    transition:border-color .15s,background .15s;
  }
  .admin-chip:hover{border-color:#BFD8E0;background:#F6FAFB}
  .admin-avatar{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;
    background:linear-gradient(150deg,var(--teal) 0%,var(--ink) 100%);
  }
  .admin-chip .role{font-size:10.5px;font-weight:500;color:var(--ink-soft);display:block;margin-top:-1px}
  .admin-chip .name-block{text-align:left;line-height:1.15}
  .admin-caret{
    width:7px;height:7px;border-right:1.6px solid var(--ink-soft);border-bottom:1.6px solid var(--ink-soft);
    transform:rotate(45deg);transition:transform .15s;margin-left:2px
  }
  .admin-wrap.open .admin-caret{transform:rotate(-135deg);margin-top:3px}
  .admin-menu{
    position:absolute;top:calc(100% + 8px);right:0;min-width:150px;
    background:var(--card);border:1px solid var(--mist);border-radius:12px;
    padding:6px;box-shadow:0 18px 36px rgba(10,37,55,.14);
    opacity:0;visibility:hidden;transform:translateY(-4px);
    transition:opacity .15s,transform .15s,visibility .15s;
    z-index:60;
  }
  .admin-wrap.open .admin-menu{opacity:1;visibility:visible;transform:translateY(0)}
  .admin-menu a,.admin-menu .logout{
    width:100%;display:flex;align-items:center;gap:8px;
    padding:9px 11px;border-radius:9px;font-size:13.5px;font-weight:600;
    transition:background .12s;text-align:left;
  }
  .admin-menu a{color:var(--ink)}
  .admin-menu a:hover{background:var(--paper)}
  .admin-menu .logout{color:var(--amber)}
  .admin-menu .logout:hover{background:#FBF1DE}
  @media(max-width:820px){.admin-chip .name-block{display:none}}

  /* ===== JEJAK & JUDUL ===== */
  .page-wrap{ max-width:1280px; margin:0 auto; padding:34px 6vw 10px; }
  .crumb{
    display:inline-flex; align-items:center; gap:7px; margin-bottom:18px;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;
    color:var(--teal-deep);
  }
  .crumb:hover{ text-decoration:underline; }

  .gallery-hero-card{
    position:relative; overflow:hidden;
    border-radius:28px;
    background:linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    padding:46px 5vw;
    color:#fff;
  }
  .gallery-hero-card::before{
    content:''; position:absolute; top:-80px; right:-80px; width:280px; height:280px;
    border-radius:50%; background:rgba(255,255,255,0.14); filter:blur(6px);
  }
  .gallery-hero-card::after{
    content:''; position:absolute; bottom:-100px; left:-60px; width:220px; height:220px;
    border-radius:50%; background:rgba(217,143,62,0.25); filter:blur(10px);
  }
  .gallery-hero-inner{ position:relative; z-index:1; text-align:center; }
  .gallery-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Space Grotesk',sans-serif; font-size:11.5px; font-weight:700;
    letter-spacing:0.14em; text-transform:uppercase; color:#fff;
    background:rgba(255,255,255,0.16); padding:6px 14px; border-radius:999px;
    margin-bottom:16px;
  }
  .gallery-eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .gallery-hero-inner h1{
    font-family:'Space Grotesk',sans-serif; font-weight:700; line-height:1.12;
    font-size:clamp(28px,4vw,42px);
  }
  .gallery-hero-inner p{
    margin-top:14px; font-size:15px; line-height:1.65; color:rgba(255,255,255,0.85);
    max-width:560px; margin-left:auto; margin-right:auto;
  }

  /* Halaman khusus galeri, jadi petaknya menyesuaikan lebar layar sendiri
     (bukan 4 kolom tetap seperti cuplikan di about.html) supaya layar lebar
     memuat lebih banyak foto sekaligus. */
  .gallery-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr));
    gap:14px; margin-top:32px; position:relative; z-index:1;
  }
  .gallery-slot{
    aspect-ratio:1/1; border-radius:16px; border:2px dashed rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.75);
    font-family:'Space Grotesk',sans-serif; font-size:12px; font-weight:600;
    background:rgba(255,255,255,0.08);
  }

  /* --- Foto galeri --- */
  .gallery-item{
    position:relative; aspect-ratio:1/1; border-radius:16px; overflow:hidden;
    background:rgba(255,255,255,0.12); cursor:zoom-in;
  }
  .gallery-item img{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:transform .35s ease;
  }
  .gallery-item:hover img{ transform:scale(1.06); }
  .gallery-cap{
    position:absolute; left:0; right:0; bottom:0; padding:22px 12px 10px;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color:#fff; font-size:12px; line-height:1.45; text-align:left;
  }

  /* Tombol kelola per foto. Sengaja selalu terlihat (tidak cuma saat hover)
     karena di layar sentuh tidak ada keadaan hover. Disusun 2x2, bukan
     berjajar empat: satu baris berisi empat tombol praktis menutupi fotonya. */
  .gal-tools{
    position:absolute; top:8px; right:8px; z-index:2;
    display:flex; flex-wrap:wrap; justify-content:flex-end; gap:5px; width:63px;
  }
  .gal-tools button{
    width:29px; height:29px; border-radius:9px; border:none; cursor:pointer;
    background:rgba(0,0,0,0.55); color:#fff; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .gal-tools button:hover{ background:rgba(0,0,0,0.85); }
  .gal-tools button:disabled{ opacity:.3; cursor:default; }
  .gal-tools .hapus:hover{ background:#C0392B; }

  /* --- Panel admin --- */
  .gallery-admin{
    margin-top:22px; display:flex; flex-wrap:wrap; gap:10px;
    align-items:center; justify-content:center; position:relative; z-index:1;
  }
  .gal-btn{
    display:inline-flex; align-items:center; gap:8px; padding:11px 20px;
    border-radius:999px; border:none; cursor:pointer; background:#fff; color:var(--primary);
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px;
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .gal-btn:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
  .gal-btn:disabled{ opacity:.6; cursor:default; transform:none; box-shadow:none; }
  .gal-status{
    width:100%; text-align:center; font-size:12.5px; color:rgba(255,255,255,0.85);
  }

  /* --- Lightbox (klik foto untuk perbesar) --- */
  .lightbox{
    position:fixed; inset:0; z-index:200; padding:22px;
    background:rgba(6,20,24,0.94); display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{
    max-width:min(92vw,1100px); max-height:76vh; border-radius:12px;
    box-shadow:0 24px 70px rgba(0,0,0,0.55);
  }
  .lightbox-cap{
    color:#fff; font-size:14px; line-height:1.55; text-align:center;
    max-width:640px; min-height:1em;
  }
  .lb-close{
    position:absolute; top:16px; right:18px; width:42px; height:42px; border-radius:50%;
    border:none; cursor:pointer; background:rgba(255,255,255,0.14); color:#fff; font-size:22px;
  }
  .lb-close:hover{ background:rgba(255,255,255,0.28); }
  .lb-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:46px; height:46px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.14); color:#fff; font-size:22px;
  }
  .lb-nav:hover{ background:rgba(255,255,255,0.28); }
  .lb-prev{ left:18px; }
  .lb-next{ right:18px; }

  footer{
    text-align:center; padding:34px 6vw 44px; font-size:12.5px; color:var(--ink-soft);
  }

  @media (max-width:900px){
    .gallery-grid{ grid-template-columns:repeat(2, minmax(0,1fr)); }
    .lb-prev{ left:8px; }
    .lb-next{ right:8px; }
  }
</style>

<script>
function toggleAdminMenu(){
  document.getElementById('adminWrap').classList.toggle('open');
}
document.addEventListener('click', function(e){
  var wrap = document.getElementById('adminWrap');
  if(wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
});

(function(){
  var toggle = document.getElementById('navToggle');
  var navLinksEl = document.getElementById('navLinks');
  var backdrop = document.getElementById('navBackdrop');
  if(!toggle || !navLinksEl) return;
  toggle.addEventListener('click', function(){
    var willOpen = !navLinksEl.classList.contains('open');
    toggle.classList.toggle('open', willOpen);
    navLinksEl.classList.toggle('open', willOpen);
    if(backdrop) backdrop.classList.toggle('open', willOpen);
  });
  if(backdrop) backdrop.addEventListener('click', function(){
    toggle.classList.remove('open');
    navLinksEl.classList.remove('open');
    backdrop.classList.remove('open');
  });
})();

function doLogout(){
  if(!confirm('Keluar dari akun admin?')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  localStorage.removeItem('username');
  localStorage.removeItem('displayName');
  localStorage.removeItem('avatarInitial');
  window.location.href = 'login.html';
}

(function(){
  var token = localStorage.getItem('token');
  var role = localStorage.getItem('role');
  var loginBtn = document.getElementById('navLoginBtn');
  var adminWrap = document.getElementById('adminWrap');
  if(!loginBtn || !adminWrap) return;
  if(token && role === 'admin'){
    var displayName = localStorage.getItem('displayName') || localStorage.getItem('username') || 'Admin';
    var avatarInitial = localStorage.getItem('avatarInitial') || displayName.charAt(0).toUpperCase();
    document.getElementById('adminName').textContent = displayName;
    document.getElementById('adminAvatar').textContent = avatarInitial;
    adminWrap.style.display = '';
  } else {
    loginBtn.style.display = '';
  }
})();

/* ===================== GALERI =====================
   Halaman ini satu-satunya tempat foto galeri dikelola. about.html dan
   index.html cuma menampilkan cuplikan dan menautkan ke sini, supaya tidak
   ada dua tempat yang mengatur data yang sama.

   Data diambil dari /api/home-summary?bagian=galeri (lihat catatan di berkas
   API itu soal kenapa galeri menumpang di endpoint beranda). Pengunjung umum
   cuma melihat & memperbesar foto; tombol kelola muncul hanya kalau ada JWT
   admin di localStorage. Itu sekadar penyaring tampilan -- penjagaan
   sebenarnya ada di sisi server (requireAdmin). */
(function(){
  var API = '/api/home-summary?bagian=galeri';
  var grid = document.getElementById('galleryGrid');
  if(!grid) return;

  var adminBar = document.getElementById('galleryAdmin');
  var fileInput = document.getElementById('galleryFile');
  var addBtn = document.getElementById('galleryAddBtn');
  var statusEl = document.getElementById('galleryStatus');
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');

  var token = localStorage.getItem('token');
  var isAdmin = !!token && localStorage.getItem('role') === 'admin';
  var foto = [];
  var lbIndex = -1;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function kabar(t){ if(statusEl) statusEl.textContent = t || ''; }

  function kirim(opsi){
    return fetch(opsi.url || API, {
      method: opsi.method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: opsi.body ? JSON.stringify(opsi.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok) throw new Error(d.error || 'Gagal (kode ' + r.status + ')');
        return d;
      });
    });
  }

  function render(){
    if(!foto.length){
      var slot = '<div class="gallery-slot">Menyusul</div>';
      grid.innerHTML = isAdmin
        ? '<div class="gallery-slot">Belum ada foto</div>'
        : slot + slot + slot + slot;
      return;
    }
    grid.innerHTML = foto.map(function(f, i){
      var alt = f.keterangan || 'Foto kegiatan Sumber Air Baku';
      var cap = f.keterangan ? '<div class="gallery-cap">' + esc(f.keterangan) + '</div>' : '';
      var tools = isAdmin
        ? '<div class="gal-tools">'
          + '<button data-aksi="naik" data-i="' + i + '" title="Geser ke depan"' + (i === 0 ? ' disabled' : '') + '>&#8592;</button>'
          + '<button data-aksi="turun" data-i="' + i + '" title="Geser ke belakang"' + (i === foto.length - 1 ? ' disabled' : '') + '>&#8594;</button>'
          + '<button data-aksi="ket" data-i="' + i + '" title="Ubah keterangan">&#9998;</button>'
          + '<button class="hapus" data-aksi="hapus" data-i="' + i + '" title="Hapus foto">&times;</button>'
          + '</div>'
        : '';
      return '<div class="gallery-item" data-buka="' + i + '">'
        + '<img src="' + esc(f.url) + '" alt="' + esc(alt) + '" loading="lazy">'
        + cap + tools + '</div>';
    }).join('');
  }

  function muat(){
    fetch(API).then(function(r){ return r.json(); }).then(function(d){
      foto = (d && d.rows) || [];
      render();
    }).catch(function(){
      grid.innerHTML = '<div class="gallery-slot">Galeri gagal dimuat</div>';
    });
  }

  /* ---------- Perbesar foto ---------- */
  function buka(i){
    if(i < 0 || i >= foto.length) return;
    lbIndex = i;
    lbImg.src = foto[i].url;
    lbImg.alt = foto[i].keterangan || 'Foto kegiatan Sumber Air Baku';
    lbCap.textContent = foto[i].keterangan || '';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function tutup(){
    lightbox.classList.remove('open');
    lbImg.src = '';
    document.body.style.overflow = '';
    lbIndex = -1;
  }
  function geser(arah){
    if(lbIndex < 0 || !foto.length) return;
    buka((lbIndex + arah + foto.length) % foto.length);
  }

  document.getElementById('lbClose').addEventListener('click', tutup);
  document.getElementById('lbPrev').addEventListener('click', function(){ geser(-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ geser(1); });
  lightbox.addEventListener('click', function(e){ if(e.target === lightbox) tutup(); });
  document.addEventListener('keydown', function(e){
    if(!lightbox.classList.contains('open')) return;
    if(e.key === 'Escape') tutup();
    else if(e.key === 'ArrowLeft') geser(-1);
    else if(e.key === 'ArrowRight') geser(1);
  });

  /* ---------- Klik pada petak foto ---------- */
  grid.addEventListener('click', function(e){
    var tombol = e.target.closest('.gal-tools button');
    if(tombol){
      e.stopPropagation();
      aksiAdmin(tombol.dataset.aksi, Number(tombol.dataset.i));
      return;
    }
    var item = e.target.closest('.gallery-item');
    if(item) buka(Number(item.dataset.buka));
  });

  if(!isAdmin){ muat(); return; }

  /* ---------- Kelola (admin) ---------- */
  adminBar.style.display = '';

  function simpanUrutan(){
    // Yang dikirim SELURUH daftar id sesuai tampilan sekarang, bukan cuma foto
    // yang digeser -- lihat catatan di api/home-summary.js.
    return kirim({ method:'PATCH', body:{ urutan: foto.map(function(f){ return f.id; }) } })
      .catch(function(err){ kabar('Urutan gagal disimpan: ' + err.message); muat(); });
  }

  function aksiAdmin(aksi, i){
    var f = foto[i];
    if(!f) return;

    if(aksi === 'naik' || aksi === 'turun'){
      var j = aksi === 'naik' ? i - 1 : i + 1;
      if(j < 0 || j >= foto.length) return;
      foto[i] = foto[j]; foto[j] = f;
      render();
      kabar('Menyimpan urutan…');
      simpanUrutan().then(function(){ kabar('Urutan tersimpan.'); });
      return;
    }

    if(aksi === 'ket'){
      var baru = prompt('Keterangan foto (kosongkan untuk menghapus keterangan):', f.keterangan || '');
      if(baru === null) return;
      baru = baru.trim();
      kabar('Menyimpan keterangan…');
      kirim({ method:'PATCH', body:{ id: f.id, keterangan: baru } }).then(function(){
        f.keterangan = baru || null;
        render();
        kabar('Keterangan tersimpan.');
      }).catch(function(err){ kabar('Gagal: ' + err.message); });
      return;
    }

    if(aksi === 'hapus'){
      if(!confirm('Hapus foto ini dari galeri? Tindakan ini tidak bisa dibatalkan.')) return;
      kabar('Menghapus…');
      kirim({ url: API + '&id=' + f.id, method:'DELETE' }).then(function(d){
        foto.splice(i, 1);
        render();
        kabar(d.peringatan || 'Foto dihapus.');
      }).catch(function(err){ kabar('Gagal menghapus: ' + err.message); });
    }
  }

  addBtn.addEventListener('click', function(){ fileInput.click(); });

  fileInput.addEventListener('change', function(){
    var berkas = Array.prototype.slice.call(fileInput.files || []);
    fileInput.value = '';           // supaya memilih berkas yang sama lagi tetap memicu 'change'
    if(!berkas.length) return;
    addBtn.disabled = true;

    // Diunggah satu per satu (bukan Promise.all) supaya beberapa foto sekaligus
    // tidak menembak Serverless Function berbarengan, dan supaya kemajuannya
    // bisa dilaporkan ke pemakai.
    var gagal = 0;
    berkas.reduce(function(rantai, file, n){
      return rantai.then(function(){
        kabar('Mengunggah foto ' + (n + 1) + ' dari ' + berkas.length + '…');
        return kompresFoto(file)
          .then(function(k){ return kirim({ method:'POST', body:{ dataUrl: k.dataUrl } }); })
          .then(function(d){ foto.push(d.foto); render(); })
          .catch(function(err){ gagal++; kabar('Foto ke-' + (n + 1) + ' gagal: ' + err.message); });
      });
    }, Promise.resolve()).then(function(){
      addBtn.disabled = false;
      if(!gagal) kabar(berkas.length + ' foto berhasil diunggah. Klik ✎ untuk memberi keterangan.');
    });
  });

  muat();
})();
</script>

<script defer src="assets/js/nav-badge.js"></script>
</body>
</html>
